<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubCategory</title>
    <script>
    const myGlobalvariables = {
        username: undefined,
        sessionId: undefined
    };
    </script>
    <script src="static/js/login.js"></script>
    <script src="static/js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
    <link rel="stylesheet" href="static/css/styles.css">

</head>
<body>
    <div id="navWrap">
        <a href="./" id="linkWrap">
            <nav><span class="clean-a" >Home</span></nav>
        </a>
        <div class="messageContainer">
            <h3>Welcome</h3>
        </div>
    </div>
    <div class="marginMenuElement"></div>

    <form id="loginForm" >
        <span>
            <input type="text" id="username" name="username" placeholder="username">
            <input type="password" id="password" name="password" placeholder="password">
        </span>

        <input class="submit-btn" id="submitlogin" type="submit" value="login">
    </form>
    

    <p id="formSuccess"></p>
    <p id="welcome" class="success" style="display:none;">Welcome <span></span> </p>

    <div id="loggedBar">
        <a id="favorites" style="display: none;" class="clean-a"  href="">favorites</a>
        <button id="logoutBtn" style="display:none;">Logout</button>
    </div>    
    <br>
    <div id="emptyMessage" style="display: none;">
        <h1>There are no ads here, try another category</h1>
    </div>

    <div id="forHandle">

    </div>

    <script id="Subcategory-template" type="text/x-handlebars-template">

        <ul name="ads">
            {{#each ads}}
            <li name="categoryAd" data-sub_id="{{subcategory_id}}">
                <div class="adLezanta">
                    <h2 name="title">{{title}}</h2>
                    <button name="add_favorite" data-ad_id="{{id}}" onclick="submitFavorite(event, 'add')" >❤️</button>
                </div>
                <p name="description">{{description}}</p>
                <div class="gallery">
                {{#each images}}
                    <div class="imageFrame">
                        <img name="image" src="https://wiki-ads.onrender.com/{{this}}">
                    </div>
                {{/each}}
                </div>

                <p name="cost"> <b>{{cost}} €</b></p>
                <!--table - features-->
                <table name="specs">
                    <tr>
                        {{#each featuresArray}}
                            <td> {{this}} </td>
                        {{/each}}
                    </tr>
                </table>

            </li>
            {{/each}}
        </ul>
    </script>
    <script>
        //access to url params
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        console.log("Subcategory id: ", id);
        getAdsFromSubCategory(id)
        .then(ads=>{
            if (ads.length === 0){
                document.getElementById("emptyMessage").style.display = "block";
                console.log("no ads");
            }else {
                document.getElementById("emptyMessage").style.display = "none";
                console.log("ads found");
            }
            // handlebars
            let templateSource = document.getElementById("Subcategory-template").innerHTML;
            let template = Handlebars.compile(templateSource);
            console.log(ads);
            // make data split is this the right kind of table?
            ads.forEach(ad=>{
                ad.featuresArray = ad.features.split(';');
            });
            console.log(ads);
            let data = {
                ads: ads
            };
            let html = template(data );
            let main = document.body.querySelector('#forHandle');
            main.innerHTML += html;
        });
        
    </script>
        <script>
            let loggedIn = checkIfLoggedIn();
            submitFormInit();
        </script>
    
</body>
</html>
